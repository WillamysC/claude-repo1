# Postgres local para desenvolver e rodar os testes: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: caderninho
      POSTGRES_PASSWORD: caderninho
      POSTGRES_DB: caderninho
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
